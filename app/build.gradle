plugins {
    id 'base'
}

ext.androidConfig = [
    applicationId: 'io.github.lpittman_g.androidphoneinfo',
    appLabel     : 'Android Phone Info',
    minSdk       : 24,
    targetSdk    : 35,
    versionCode  : 1,
    versionName  : '1.0'
]

def androidConfig = ext.androidConfig
def manifestFile = layout.projectDirectory.file('src/main/AndroidManifest.xml').asFile

tasks.register('verifyBuildFiles') {
    group = 'verification'

    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException("Missing Android manifest at ${manifestFile}")
        }

        def manifestText = manifestFile.getText('UTF-8')
        if (!manifestText.contains('<manifest')) {
            throw new GradleException('Android manifest is missing the <manifest> root element.')
        }
        if (!manifestText.contains("android:label=\"${androidConfig.appLabel}\"")) {
            throw new GradleException('Android manifest is missing the expected application label.')
        }
    }
}

tasks.register('assembleDebug') {
    group = 'build'
    dependsOn 'verifyBuildFiles'

    doLast {
        def outputFile = layout.buildDirectory.file('outputs/metadata/debug/build-files.properties').get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = """applicationId=${androidConfig.applicationId}
appLabel=${androidConfig.appLabel}
minSdk=${androidConfig.minSdk}
targetSdk=${androidConfig.targetSdk}
versionCode=${androidConfig.versionCode}
versionName=${androidConfig.versionName}
"""
    }
}

tasks.register('testDebugUnitTest') {
    group = 'verification'
    dependsOn 'verifyBuildFiles'
}

tasks.named('assemble') {
    dependsOn 'assembleDebug'
}

tasks.named('check') {
    dependsOn 'testDebugUnitTest'
}

tasks.named('build') {
    dependsOn 'assembleDebug', 'testDebugUnitTest'
}
